<!doctype html>
<!-- The app is dark-themed throughout; without this the design tokens resolve to
     their light palette and token-coloured text renders near-black on the dark
     background. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installed to a home screen the app launches without browser chrome, which
         is the only way to get full screen without a user gesture. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vision Hero" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Vision Hero</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
